name: Testing

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "rc"
      - "hotfix-rc-*"
  pull_request:
    types: [ opened, synchronize ]

permissions: {}

jobs:

  typecheck:
    name: Run typechecking
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Node Version
        id: retrieve-node-version
        run: |
          NODE_NVMRC=$(cat .nvmrc)
          NODE_VERSION=${NODE_NVMRC/v/''}
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          node-version: ${{ steps.retrieve-node-version.outputs.node_version }}

      - name: Print environment
        run: |
          node --version
          npm --version

      - name: Install Node dependencies
        run: npm ci

      # We use isolatedModules: true which disables typechecking in tests
      # Tests in apps/ are typechecked when their app is built, so we just do it here for libs/
      # See https://bitwarden.atlassian.net/browse/EC-497
      - name: Run typechecking
        run: npm run test:types

  affected-tests:
    name: Find affected test projects
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.groups.outputs.groups }}

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get Node Version
        id: retrieve-node-version
        run: |
          NODE_NVMRC=$(cat .nvmrc)
          NODE_VERSION=${NODE_NVMRC/v/''}
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          node-version: ${{ steps.retrieve-node-version.outputs.node_version }}

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Set Nx base and head
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # Pull requests run only affected projects. Pushes and manual runs test everything.
      - name: Compute test groups
        id: groups
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/nx-affected-test-groups.mjs >> "$GITHUB_OUTPUT"
          else
            node scripts/nx-affected-test-groups.mjs --all >> "$GITHUB_OUTPUT"
          fi

  testing:
    name: Run tests - ${{ matrix.test-group.name }}
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read
      pull-requests: write

    needs: affected-tests
    if: needs.affected-tests.outputs.groups != '[]'

    strategy:
      fail-fast: false
      matrix:
        # Same groups as before (Browser, Web, Desktop, CLI, Libs), but each group's paths are
        # only the roots of affected Nx projects, and groups with nothing affected are left out.
        test-group: ${{ fromJSON(needs.affected-tests.outputs.groups) }}

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Node Version
        id: retrieve-node-version
        run: |
          NODE_NVMRC=$(cat .nvmrc)
          NODE_VERSION=${NODE_NVMRC/v/''}
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          node-version: ${{ steps.retrieve-node-version.outputs.node_version }}

      - name: Print environment
        run: |
          node --version
          npm --version

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests - ${{ matrix.test-group.name }}
        # maxWorkers is a workaround for a memory leak that crashes tests in CI:
        # https://github.com/facebook/jest/issues/9430#issuecomment-1149882002
        # Reduced to 2 workers and split tests across parallel jobs to prevent OOM kills
        run: npm test -- ${{ matrix.test-group.paths }} --coverage --maxWorkers=2 --workerIdleMemoryLimit=1500MiB
        env:
          JEST_JUNIT_OUTPUT_NAME: ${{ matrix.test-group.junit }}

      - name: Report test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        # This will skip the job if it's a pull request from a fork, because that won't have permission to upload test results.
        # PRs from the repository and all other events are OK.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && !cancelled()
        with:
          name: Test Results - ${{ matrix.test-group.name }}
          path: ${{ matrix.test-group.junit }}
          reporter: jest-junit
          fail-on-error: true

      - name: Upload results to codecov.io
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          report_type: test_results

      - name: Upload test coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.test-group.artifact }}
          path: ./coverage/lcov.info

  rust:
    name: Run Rust tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os || 'ubuntu-22.04' }}
    permissions:
      contents: read

    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - macos-26
          - windows-2022

    steps:
      - name: Check Rust version
        run: rustup --version

      - name: Install gnome-keyring
        if: ${{ matrix.os=='ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed crates
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          filters: |
            ssh_agent:
              - 'apps/desktop/desktop_native/ssh_agent/**'

      - name: Build
        working-directory: ./apps/desktop/desktop_native
        run: cargo build

      - name: Linux test setup
        if: ${{ matrix.os=='ubuntu-22.04' }}
        run: |
          mkdir -p ~/.cache
          mkdir -p ~/.local/share/keyrings
          eval "$(dbus-launch --sh-syntax)"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock)"
          eval "$(printf '\n' | /usr/bin/gnome-keyring-daemon --start)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Linux unit tests
        if: ${{ matrix.os=='ubuntu-22.04' }}
        working-directory: ./apps/desktop/desktop_native
        run: cargo test --lib -- --test-threads=1

      - name: MacOS unit tests
        if: ${{ matrix.os=='macos-26' }}
        working-directory: ./apps/desktop/desktop_native
        run: cargo test --lib -- --test-threads=1

      - name: Windows unit tests
        if: ${{ matrix.os=='windows-2022'}}
        working-directory: ./apps/desktop/desktop_native
        run: cargo test --lib --workspace --exclude=desktop_napi -- --test-threads=1

      - name: Integration tests ssh_agent
        if: ${{ steps.changes.outputs.ssh_agent == 'true' }}
        working-directory: ./apps/desktop/desktop_native
        run: cargo test -p ssh_agent --test '*' -- --test-threads=1

      - name: Doc tests
        working-directory: ./apps/desktop/desktop_native
        run: cargo test --doc

  rust-coverage:
    name: Rust Coverage
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Resolved from desktop_native/rust-toolchain.toml, the single source of
      # truth, so a Renovate bump can't leave a stale literal here. Assigned before
      # echoing so a failure in the reader fails the step; see lint.yml.
      - name: Resolve Rust toolchain
        id: toolchain
        run: |
          RUST_TOOLCHAIN="$(node scripts/rust-toolchain.mjs)"
          echo "RUST_TOOLCHAIN=${RUST_TOOLCHAIN}" | tee -a "${GITHUB_OUTPUT}"

      - name: Install rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.RUST_TOOLCHAIN }}
          components: llvm-tools

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: "apps/desktop/desktop_native -> target"

      - name: Install cargo-run-bin
        run: cargo install cargo-run-bin --locked --version 1.7.4

      - name: Check cargo-binstall is not configured
        run: node scripts/check-no-binstall.mjs

      - name: Generate coverage
        working-directory: ./apps/desktop/desktop_native
        run: cargo bin cargo-llvm-cov --all-features --lcov --output-path lcov.info --workspace --no-cfg-coverage

      - name: Upload test coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: ./apps/desktop/desktop_native/lcov.info

  upload-codecov:
    name: Upload to Codecov
    runs-on: ubuntu-22.04
    if: ${{ !cancelled() && needs.rust-coverage.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.testing.result) }}
    needs:
      - testing
      - rust-coverage
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the affected test groups upload coverage, so download whichever exist.
      - name: Download jest coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jest-coverage-*
          path: ./jest-coverage

      - name: Download rust coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-coverage
          path: ./apps/desktop/desktop_native

      - name: Upload coverage to codecov.io
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          directory: ./jest-coverage
          files: ./apps/desktop/desktop_native/lcov.info

  run-tests: # Verifies all required tests complete successfully
    name: Run tests
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - typecheck
      - affected-tests
      - testing
      - rust
      - rust-coverage
      - upload-codecov
    permissions:
      contents: read

    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Print status of all jobs
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          # Collect failed jobs
          failed_jobs=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' | tr '\n' ' ')

          if [ -n "$failed_jobs" ]; then
            echo "::error::The following jobs failed:$failed_jobs"
            exit 1
          fi

          echo "All required jobs passed successfully!"
