name: SDK Build @bitwarden/sdk-internal

on:
  pull_request:
  push:
    branches:
      - "main"
      - "monorepo/main"
      - "rc"
      - "hotfix-rc"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/_build-sdk-wasm.yml
    permissions:
      contents: read

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore SDK WASM packages
        uses: ./.github/actions/restore-sdk-wasm

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: sdk/e2e/wasm/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sdk/e2e/wasm

      - name: Run e2e tests
        run: npm test
        working-directory: sdk/e2e/wasm
