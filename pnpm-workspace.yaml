packages:
  - "apps/*"
  - "apps/desktop/desktop_native/napi"
  - "e2e"
  - "libs/**/*"
  - "sdk"
  - "sdk/crates/bitwarden-wasm-internal/npm"
  - "sdk/crates/bitwarden-wasm-internal/bitwarden_license/npm"

saveExact: true

# Versions shared by several package.json files and the overrides below.
catalog:
  eslint: "9.39.4"
  prettier: "3.9.5"
  tailwindcss: "3.4.18"

# Increase available heap size to avoid running out of memory when compiling.
# This applies to all scripts that pnpm runs in this repository.
nodeOptions: "--max-old-space-size=8192"

# Link every workspace package into the root node_modules, as npm workspaces do. Code
# and config resolve them by package name from there: jest configs whose moduleNameMapper
# does not cover every @bitwarden import, deep imports such as
# "@bitwarden/components/src/...", and styles that load a library's own fonts and images
# (url("~@bitwarden/angular/src/...")).
publicHoistPattern:
  - "@bitwarden/*"

overrides:
  "eslint-plugin-rxjs>eslint": "catalog:"
  "eslint-plugin-rxjs-angular>eslint": "catalog:"
  "tailwindcss": "catalog:"
  "react": "18.3.1"
  "react-dom": "18.3.1"
  "@types/react": "18.3.27"
  "@angular-devkit/build-angular>jest-environment-jsdom": "30.4.1"
  "tmp": ">=0.2.4"
  "vite": "^7.3.6"

# Dependencies whose install scripts run. Packages that only print a message are denied.
allowBuilds:
  "@compodoc/compodoc": false
  "@openapitools/openapi-generator-cli": false
  "@parcel/watcher": true
  "@swc/core": true
  bufferutil: true
  core-js: false
  electron-winstaller: true
  es5-ext: false
  esbuild: true
  fsevents: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  ttf2woff2: true
  unrs-resolver: true
  utf-8-validate: true
